prepare:
  raw_root: seg_dataset/AIHUB/신호등-도로표지판 인지 영상(수도권)
  workers: 4
  crop:
    input_size: 128
    padding_ratio: 0.15
    min_crop_side_px: 4
    clip_to_image: true
    color_space: rgb
    normalization: imagenet
    interpolation: bilinear

train:
  output_root: runs
  device: cuda:0
  precision: bf16
  max_steps: 5000
  logical_batch_size: 256
  microbatch_size: 128
  num_workers: 4
  validation_every: 200
  validation_samples: 1024
  log_every: 20
  seed: 26
  sampling: balanced
  selection_metric: macro_state_f1
  learning_rate: 0.001
  lr_schedule: constant
  weight_decay: 0.0001
  arrow_loss_weight: 1.0
  checkpoint_interval_sec: 600
  initial_checkpoint: models/signal_attr/best_signal_attr.pt
  # 학습 crop에만 적용한다. 좌우 반전과 hue 변경은 라벨과 어긋나므로 넣지 않는다.
  # 대조 실행은 train 명령에 --no-augment를 준다.
  augment:
    enabled: true
    jitter_prob: 0.5
    jitter_scale: [0.9, 1.1]
    jitter_shift: 0.08
    photometric_prob: 0.5
    brightness: 0.25
    contrast: 0.25
    saturation: 0.2
    lowres_prob: 0.5
    lowres_min_short_side_px: 8
    blur_prob: 0.3
    blur_radius_px: [0.3, 0.8]
    jpeg_prob: 0.3
    jpeg_quality: [50, 90]
